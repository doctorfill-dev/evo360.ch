name = "evo360"
compatibility_date = "2025-01-01"

# Script Worker principal : gère /api/keystatic/* + délègue le reste aux assets
main = "worker.ts"

# Dossier des fichiers statiques construits par Eleventy + Vite
[assets]
directory = "./_site"

# Le fallback 404 est géré manuellement dans worker.ts :
#   - /keystatic/* non-API → keystatic/index.html (SPA admin)
#   - Tout autre 404       → 404.html avec status 404
not_found_handling = "none"
