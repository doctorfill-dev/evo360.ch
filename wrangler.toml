name = "evo360"
compatibility_date = "2025-01-01"

# Script Worker principal : gère /api/keystatic/* + délègue le reste aux assets
main = "worker.ts"

# Dossier des fichiers statiques construits par Eleventy + Vite
[assets]
directory = "./_site"

# "404-page" : ASSETS sert automatiquement 404.html (status 404) pour tout
# fichier manquant, sans jamais lancer d'exception dans le Worker.
# Le Worker intercepte uniquement le cas /keystatic/* (SPA admin).
not_found_handling = "404-page"
