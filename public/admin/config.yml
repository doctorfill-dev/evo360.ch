# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
local_backend: true

backend:
  name: github
  repo: doctorfill-dev/evo360.ch
  branch: main

media_folder: "public/img"
public_folder: "/img"

collections:
  - name: "services"
    label: "Services"
    folder: "content/services"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "ID Visuel", name: "id", widget: "string" }
      - { label: "Ordre", name: "order", widget: "number" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Corps", name: "body", widget: "markdown" }

  - name: "testimonials"
    label: "Témoignages"
    folder: "content/testimonials"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nom", name: "name", widget: "string" }
      - { label: "Age / Infos", name: "age", widget: "string" }
      - { label: "Initiale", name: "initial", widget: "string" }
      - { label: "Couleur (CSS variable)", name: "color", widget: "string" }
      - { label: "Texte", name: "text", widget: "text" }
      - { label: "Ordre", name: "order", widget: "number" }

  - name: "pages"
    label: "Contenu des Sections"
    files:
      - name: "hero"
        label: "Section Hero (Accueil)"
        file: "content/sections/hero.md"
        fields:
          - { label: "Badge", name: "badge", widget: "string" }
          - { label: "Titre (HTML autorisé)", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Image Principale", name: "img1", widget: "image" }
          - { label: "Image Secondaire", name: "img2", widget: "image" }
          - { label: "Image Tertiaire", name: "img3", widget: "image" }

      - name: "about"
        label: "Section À Propos"
        file: "content/sections/about.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Texte Introduction", name: "lead", widget: "text" }
          - { label: "Texte Principal", name: "body", widget: "markdown" }
          - { label: "Citation", name: "quote", widget: "string" }
          - { label: "Image", name: "image", widget: "image" }

      - name: "contact"
        label: "Section Contact"
        file: "content/sections/contact.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Adresse", name: "address", widget: "text" }
          - { label: "Téléphone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Accès", name: "access", widget: "text" }
